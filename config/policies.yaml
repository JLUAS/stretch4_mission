  #   ckpt: ~/policies/floor_cabinet_open/pretrained_model       # on the Jetson: --pretrained_name_or_path
  #   dataset: ~/.cache/huggingface/lerobot/SilentSammy2001/floor_cabinet_open_20261022_105005  # --robot.preprocessing_from
  #   policy_type: diffusion                                    # or pi05, act, ...
  #   run_args: --fps=30 --actions_per_chunk=48 --policy_device=cuda --chunk_size_threshold=0.7 --robot.use_base=true
  #   max_runtime_sec: 120                                      # seconds; auto works only for runner recorder

