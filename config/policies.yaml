# Policy library: one entry per trained policy, run by policy_bridge.py with the policy's runner:
#   runner: recorder (default, stretch4_policy_recorder)
#     robot:  stretch4_goto_pose --root <root>            (start pose, from the policy's dataset)
#     robot:  stretch4_policy_stream + stretch4_policy_exec
#     Jetson: stretch4_policy_run --ckpt <ckpt> <run_args>
#   runner: lerobot (lerobot_stretch4, LeRobot async inference; needs dataset and policy_type)
#     robot:  stretch4_pose goto <root>/<pose file>
#     Jetson: stretch4_policy_server
#     robot:  python -m lerobot.async_inference.robot_client ... <run_args>
# The mission sets these keys on the bridge at every step. Machine settings: config/policy_runner.yaml.
# sync_policies (run by scripts/run_ui_robot.sh) adds new policies at the end of this file; see README.
# max_runtime_sec: seconds, or auto = the longest episode recorded in <root> + runtime_margin_sec (worked out when
# the mission starts, from each episode_*/records.jsonl; keep it below policy_timeout in config/mission.yaml).
# runtime_margin_sec here is for every auto policy; a policy can set its own to override it.
runtime_margin_sec: 10.0

policies:
  grab_sponge:
    task: Grab the sponge
    root: ~/data/grab_sponge                 # on the robot
    ckpt: ~/policies/grab_sponge.ckpt        # on the Jetson
    run_args: --fp16 --base                  # --yes and --duration <max_runtime_sec> are always added
    max_runtime_sec: auto                    # this policy has no learned done signal

  clean_table:
    task: Clean the table
    root: ~/data/clean_table
    ckpt: ~/policies/clean_table.ckpt        # expected on the Jetson after training
    run_args: --num-inference-steps 5 --fp16 --schedule async --base
    max_runtime_sec: auto

  # Template for a LeRobot policy (runner: lerobot; sync_policies adds these too):
  # floor_cabinet_open:
