# MuJoCo sim only: stand-ins for a 3-policy "clean the table" mission. sim_policy_bridge moves the lift and arm
# to <root>/start_pose.json and reports RUNNING; ckpt and run_args are not used.
policies:
  open_cabinet:
    task: Open the cabinet (SIM)
    root: ~/tec_workspace/stretch4_mission/config/sim_start_poses/open_cabinet
    ckpt: sim
    max_runtime_sec: 10.0
  pick_sponge:
    task: Pick the sponge (SIM)
    root: ~/tec_workspace/stretch4_mission/config/sim_start_poses/pick_sponge
    ckpt: sim
    max_runtime_sec: 10.0
  clean_table:
    task: Clean the table (SIM)
    root: ~/tec_workspace/stretch4_mission/config/sim_start_poses/clean_table
    ckpt: sim
    max_runtime_sec: 10.0
